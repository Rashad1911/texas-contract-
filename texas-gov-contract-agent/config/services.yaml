# Service categories the scout looks for. To add one, copy a block and change it (README §7).
#
#   keywords     words/phrases that identify the service (title matches count most)
#   naics        NAICS codes commonly used for it (federal notices carry one)
#   startup      low | medium | high   — typical cost to stand up the work
#   outsource    high | medium | low   — how naturally it fits a manage-and-subcontract model
#   margin       low | medium | high   — typical margin for a managing prime
#   licenses     licenses often required in Texas (the Requirements agent still reads the actual solicitation)
#   subcontractor what kind of vendor would do the work
#   related      categories the Discovery agent suggests when this one shows up a lot
#   exclude      (optional) title words that mean it's a different, specialized trade
#
# Profiles are starting assumptions, not facts about any specific solicitation.

categories:
  janitorial:
    label: "Janitorial / custodial"
    keywords: [janitorial, custodial, building cleaning, office cleaning, cleaning services, housekeeping,
               day porter, restroom cleaning, sanitization, disinfection, facility cleaning, floor care,
               carpet cleaning, strip and wax, floor stripping]
    naics: ["561720"]
    startup: low
    outsource: high
    margin: low
    licenses: []
    subcontractor: "Commercial janitorial company with its own crews and supervisor"
    related: [window_cleaning, pressure_washing, pest_control, waste_hauling, post_construction_cleaning]

  post_construction_cleaning:
    label: "Post-construction / make-ready cleaning"
    keywords: [post-construction cleaning, post construction clean, construction cleanup, final clean,
               make-ready, make ready, turnover cleaning, move-out cleaning, rough clean]
    naics: ["561720", "238990"]
    startup: low
    outsource: high
    margin: medium
    licenses: []
    subcontractor: "Post-construction cleaning crew"
    related: [janitorial, pressure_washing, window_cleaning, waste_hauling]

  pressure_washing:
    label: "Pressure washing"
    keywords: [pressure washing, power washing, pressure wash, soft wash, surface cleaning, hydro washing,
               parking garage cleaning, sidewalk washing]
    naics: ["561790"]
    startup: low
    outsource: high
    margin: medium
    licenses: []
    subcontractor: "Pressure-washing contractor with water reclamation equipment"
    related: [graffiti_street_cleaning, parking_lot, window_cleaning]

  window_cleaning:
    label: "Window cleaning"
    keywords: [window cleaning, window washing, glass cleaning, high-rise window]
    naics: ["561720", "561790"]
    startup: low
    outsource: high
    margin: medium
    licenses: []
    subcontractor: "Window-cleaning company (rope/lift certified for high-rise)"
    related: [janitorial, pressure_washing]

  landscaping:
    label: "Landscaping / grounds maintenance"
