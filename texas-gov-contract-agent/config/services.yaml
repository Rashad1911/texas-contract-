# Phrases that mark a notice as goods-only (a supply purchase, not a service).
supply_signals: ["supplies", "supply of", "purchase of", "parts", "equipment purchase", "furnish and deliver",
                 "brand name", "or equal", "commodities", "products", "materials", "vehicle purchase"]

# Phrases that indicate major construction or professional services outside the model.
out_of_scope_signals: ["new construction", "design-build", "design build", "construction manager at risk",
                       "cmar", "general contractor", "architectural services", "engineering services",
                       "bridge replacement", "roadway reconstruction", "paving project", "software",
                       "information technology", "it services", "medical services", "legal services",
                       "audit services", "financial advisor", "underwriting", "pharmaceutical"]
