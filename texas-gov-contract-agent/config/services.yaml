    startup: medium
    outsource: high
    margin: medium
    licenses: ["ISA Certified Arborist often required on staff or as a sub"]
    subcontractor: "Tree service with bucket truck, chipper, and stump grinder"
    related: [debris_removal, landscaping]

  debris_removal:
