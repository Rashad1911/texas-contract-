               grounds keeping, groundskeeping, turf maintenance, irrigation, right-of-way mowing,
               vegetation management, herbicide application, litter removal and mowing]
    naics: ["561730"]
    startup: medium
    outsource: high
    margin: medium
    licenses: ["TDA pesticide applicator license if herbicides are applied",
               "TCEQ irrigator license for irrigation work"]
    subcontractor: "Commercial landscaping / mowing contractor"
    related: [tree_services, debris_removal, pest_control, graffiti_street_cleaning]

  tree_services:
    label: "Tree trimming / removal / stump grinding"
