# Runs the Texas Government Contract Opportunity Agent.
#  - Checks daily; the app itself only does a full search every 3 days and skips quietly in between.
#  - "Run workflow" on the Actions tab runs a full search right now.
#  - A file at texas-gov-contract-agent/data/catch_up_days (e.g. "60") makes the next run a one-time deeper SAM.gov search.
#  - The code lives in the texas-gov-contract-agent/ subfolder, so every step runs there.
#  - The dashboard (texas-gov-contract-agent/docs) is published to GitHub Pages after each run.
name: Contract Scout

on:
  schedule:
    - cron: "0 11 * * *"      # 11:00 UTC = 6 AM CDT / 5 AM CST
  workflow_dispatch:
    inputs:
      force:
        description: "Run a full search now, even if one ran recently"
        type: boolean
        default: true
      send_email:
        description: "Send the email report"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: contract-data
  cancel-in-progress: false

defaults:
  run:
    working-directory: texas-gov-contract-agent

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SAM_API_KEY: ${{ secrets.SAM_API }}
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.E_MAIL }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      SEND_EMAIL: ${{ github.event_name != 'workflow_dispatch' || inputs.send_email }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run the agent
        run: |
          ARGS=""
          # One-time catch-up: if data/catch_up_days exists (e.g. "60"), this run searches SAM.gov that many
          # days back using the full daily request budget, then deletes the file once SAM.gov reads cleanly.
          CATCH_UP=""
          if [ -f data/catch_up_days ]; then CATCH_UP=$(tr -dc '0-9' < data/catch_up_days); fi
          if [ -n "$CATCH_UP" ]; then
            echo "One-time catch-up: searching SAM.gov notices from the last $CATCH_UP days."
            sed -i -E "s/^( *lookback_days: *)[0-9]+/\1$CATCH_UP/" config/sources.yaml
            sed -i -E "s/^( *reserve_requests: *)[0-9]+/\10/" config/settings.yaml
            FORCE=true
          fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "$SEND_EMAIL" != "true" ]; then ARGS="$ARGS --no-email"; fi
          python main.py run $ARGS
          if [ -n "$CATCH_UP" ]; then
            if python -c "import json,sys; d=json.load(open('docs/data.json')); sys.exit(0 if any(s.get('key')=='sam' and s.get('status')=='ok' for s in d.get('sources',[])) else 1)"; then
              rm -f data/catch_up_days
              echo "Catch-up finished; next run goes back to the normal window."
            else
              echo "SAM.gov did not read cleanly; keeping the catch-up for the next run."
            fi
          fi

      - name: Save results to the repository
        run: |
          git config user.name "contract-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Contract report $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - name: Upload dashboard for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: texas-gov-contract-agent/docs

      - name: Deploy dashboard to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
